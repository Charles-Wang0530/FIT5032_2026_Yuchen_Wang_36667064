name: Deploy NoMash Library to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'NOMASH_LIBRARY_WYC/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: NOMASH_LIBRARY_WYC/package-lock.json

      - name: Install dependencies
        working-directory: NOMASH_LIBRARY_WYC
        run: npm ci

      - name: Build
        working-directory: NOMASH_LIBRARY_WYC
        run: npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.7.3
        with:
          branch: gh-pages
          folder: NOMASH_LIBRARY_WYC/dist
